<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow</title>
    
    <!-- Tailwind CSS (Play CDN for rapid prototyping) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>

    <!-- Vue 3 & GSAP -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Custom CSS strictly for the Wave Mesh Background -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen relative overflow-x-hidden font-sans transition-colors duration-500">
    <!-- Fluid Wave Mesh -->
    <div class="wave-background"></div>
    <div id="custom-cursor"></div>

    <div id="app" class="max-w-6xl mx-auto px-6 py-12">
        <!-- Header -->
        <header class="text-center mb-16 relative">
            <button 
                @click="toggleTheme" 
                class="absolute top-0 right-0 p-3 bg-white/40 dark:bg-slate-800/40 backdrop-blur-md border border-white/40 dark:border-white/10 rounded-full shadow-lg hover:scale-110 transition-transform duration-200 text-xl"
                :aria-label="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
            >
                {{ isDarkMode ? '☀️' : '🌙' }}
            </button>
            <h1 class="text-5xl font-extrabold tracking-tight mb-2 drop-shadow-sm">Focus Flow</h1>
            <p class="text-lg text-slate-600 dark:text-slate-400 font-medium">Focus and track your sessions</p>
        </header>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10 items-start">
            
            <!-- Task Manager Column -->
            <div class="lg:col-span-1 space-y-6">
                <h2 class="text-2xl font-semibold drop-shadow-sm">Task Manager</h2>
                
                <!-- Input Group -->
                <div class="flex gap-3">
                    <input 
                        type="text" 
                        v-model="newTask" 
                        @keyup.enter="addTask" 
                        placeholder="Add a new task..."
                        class="flex-1 px-4 py-3 bg-white/50 dark:bg-slate-800/50 backdrop-blur-md border border-white/50 dark:border-white/10 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all placeholder-slate-400 dark:placeholder-slate-500"
                    >
                    <button 
                        @click="addTask"
                        class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-lg transition-transform active:scale-95"
                    >
                        Add
                    </button>
                </div>

                <!-- Task List -->
                <ul class="space-y-4">
                    <li 
                        v-for="task in tasks" 
                        :key="task.id"
                        class="card group flex justify-between items-center bg-white/40 dark:bg-slate-800/40 backdrop-blur-xl border border-white/40 dark:border-white/10 rounded-2xl p-5 shadow-xl hover:shadow-2xl transition-all duration-300 transform"
                    >
                        <span class="text-lg font-medium">{{ task.text }}</span>
                        <button 
                            @click="deleteTask(task.id)" 
                            class="text-slate-400 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 p-2 rounded-lg transition-colors"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </li>
                </ul>

                <div v-if="tasks.length === 0" class="text-center text-slate-500 dark:text-slate-400 italic mt-8">
                    No tasks yet. Add one above!
                </div>
            </div>

            <!-- Session History Column -->
            <div class="lg:col-span-2 space-y-6">
                <h2 class="text-2xl font-semibold drop-shadow-sm">Session History</h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div 
                        v-for="(session, index) in sessions" 
                        :key="index"
                        class="card flex flex-col gap-3 bg-white/40 dark:bg-slate-800/40 backdrop-blur-xl border border-white/40 dark:border-white/10 rounded-2xl p-6 shadow-xl hover:shadow-2xl transition-all duration-300 transform"
                    >
                        <h3 class="text-xl font-bold">{{ session.title }}</h3>
                        <span class="text-sm text-slate-500 dark:text-slate-400 font-medium">{{ session.date }}</span>
                        
                        <div class="mt-auto pt-2">
                            <span 
                                class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"
                                :class="{
                                    'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-300': session.status === 'Completed',
                                    'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300': session.status === 'Active',
                                    'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-300': session.status === 'Pending'
                                }"
                            >
                                {{ session.status }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Check</title>
    <link rel="stylesheet" href="style.css">
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="wave-background"></div>
    <div id="custom-cursor"></div>
    <div id="app" class="container">
        <header>
            <button class="theme-toggle" @click="toggleTheme" :aria-label="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">{{ isDarkMode ? '☀️' : '🌙' }}</button>
            <h1>Focus Flow</h1>
            <p class="subtitle">Focus and track your sessions</p>
        </header>
        
        <main class="grid-layout">
            <!-- Task Manager Section -->
            <section class="task-manager">
                <h2>Task Manager</h2>
                <div class="input-group">
                    <input type="text" v-model="newTask" @keyup.enter="addTask" placeholder="Add a new task to focus on...">
                    <button @click="addTask">Add</button>
                </div>
                <ul class="task-list">
                    <li v-for="(task, index) in tasks" :key="index" 
                        class="card task-card" 
                        @mousemove="tiltEffect($event)" 
                        @mouseleave="resetTilt($event)">
                        <span class="task-text">{{ task }}</span>
                        <button class="delete-btn" @click="deleteTask(index, $event)" aria-label="Delete task">✕</button>
                    </li>
                    <li v-if="tasks.length === 0" class="empty-state">
                        No tasks yet. Add one above!
                    </li>
                </ul>
            </section>
            
            <!-- Session History Section -->
            <section class="session-history">
                <h2>Session History</h2>
                <div class="history-grid">
                    <div v-for="(session, index) in sessions" :key="index" 
                         class="card history-card"
                         @mousemove="tiltEffect($event)" 
                         @mouseleave="resetTilt($event)">
                        <h3>{{ session.title }}</h3>
                        <p class="date">{{ session.date }}</p>
                        <span class="status" :class="session.status.toLowerCase()">{{ session.status }}</span>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow</title>
    
    <!-- Google Fonts & Material Design Icons -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.x/css/materialdesignicons.min.css" rel="stylesheet">
    
    <!-- Vuetify CSS -->
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.4.0/dist/vuetify.min.css" rel="stylesheet">
    
    <!-- Custom GSAP Styling (Optional) -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Vue 3 & Vuetify JS -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.4.0/dist/vuetify.min.js"></script>
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="custom-cursor"></div>
    <div id="app">
        <v-app :theme="isDarkMode ? 'dark' : 'light'">
            <!-- App Bar -->
            <v-app-bar flat color="transparent" class="px-4 mt-2">
                <v-app-bar-title class="text-h4 font-weight-bold">Focus Flow</v-app-bar-title>
                <v-spacer></v-spacer>
                <v-btn icon @click="toggleTheme">
                    <v-icon size="large">{{ isDarkMode ? 'mdi-weather-sunny' : 'mdi-weather-night' }}</v-icon>
                </v-btn>
            </v-app-bar>

            <!-- Main Content -->
            <v-main>
                <v-container class="mt-8" max-width="1200">
                    <p class="text-subtitle-1 text-medium-emphasis mb-8">Focus and track your sessions</p>

                    <v-row>
                        <!-- Task Manager -->
                        <v-col cols="12" md="4">
                            <h2 class="text-h5 font-weight-medium mb-4">Task Manager</h2>
                            
                            <div class="d-flex align-center mb-6">
                                <v-text-field
                                    v-model="newTask"
                                    label="Add a new task..."
                                    variant="outlined"
                                    hide-details
                                    @keyup.enter="addTask"
                                ></v-text-field>
                                <v-btn 
                                    color="primary" 
                                    size="large" 
                                    class="ml-2" 
                                    @click="addTask"
                                    elevation="2"
                                >
                                    Add
                                </v-btn>
                            </div>

                            <v-slide-y-transition group>
                                <v-card
                                    v-for="(task, index) in tasks"
                                    :key="task + index"
                                    class="mb-3"
                                    elevation="1"
                                    hover
                                >
                                    <v-card-text class="d-flex justify-space-between align-center py-2 pl-4 pr-2">
                                        <span class="text-body-1">{{ task }}</span>
                                        <v-btn icon variant="text" color="error" @click="deleteTask(index)">
                                            <v-icon>mdi-close</v-icon>
                                        </v-btn>
                                    </v-card-text>
                                </v-card>
                            </v-slide-y-transition>
                            
                            <div v-if="tasks.length === 0" class="text-center text-medium-emphasis mt-6 font-italic">
                                No tasks yet. Add one above!
                            </div>
                        </v-col>

                        <!-- Session History -->
                        <v-col cols="12" md="8">
                            <h2 class="text-h5 font-weight-medium mb-4">Session History</h2>
                            <v-row>
                                <v-col
                                    v-for="(session, index) in sessions"
                                    :key="index"
                                    cols="12"
                                    sm="6"
                                    md="4"
                                >
                                    <v-card class="h-100" hover elevation="2">
                                        <v-card-title class="text-h6">{{ session.title }}</v-card-title>
                                        <v-card-subtitle class="mt-1">{{ session.date }}</v-card-subtitle>
                                        <v-card-text class="mt-4">
                                            <v-chip
                                                :color="getStatusColor(session.status)"
                                                size="small"
                                                class="font-weight-bold"
                                                variant="flat"
                                            >
                                                {{ session.status.toUpperCase() }}
                                            </v-chip>
                                        </v-card-text>
                                    </v-card>
                                </v-col>
                            </v-row>
                        </v-col>
                    </v-row>
                </v-container>
            </v-main>
        </v-app>
    </div>
    <script src="main.js"></script>
</body>
</html>

name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install dependencies
      run: npm install
    - name: Run Linter
      run: npm run lint
    - name: Run Unit Tests with Coverage
      run: npx vitest run --coverage

  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install pytest
      run: pip install pytest pytest-cov requests
    - name: Run Python Tests with Coverage
      run: PYTHONPATH=. pytest tests/backend_test.py --cov=server --cov-report=term
